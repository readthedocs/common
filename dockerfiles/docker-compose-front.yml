# Front proxy to run the community and business environments side by side.
#
# Both environments publish NGINX on port 80 by default.
# Start each one with a different `RTDDEV_PORT_NGINX` and this proxy takes port 80,
# routing `*.devthedocs.com` to business and everything else to community.
# See `inv docker.front`.
name: rtd-front

services:
  front:
    image: nginx:1.22
    ports:
      - "80:80"
    environment:
      - RTDDEV_FRONT_COMMUNITY_PORT=${RTDDEV_FRONT_COMMUNITY_PORT:-10080}
      - RTDDEV_FRONT_BUSINESS_PORT=${RTDDEV_FRONT_BUSINESS_PORT:-10081}
    # Required on Linux; Docker Desktop resolves it already.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PWD}/common/dockerfiles/nginx-front:/etc/nginx/templates
    logging:
      driver: "none"
